name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Cache LOCAL do turbo — nao ha cache remoto, por decisao. Um PR reaproveita
      # o cache do ultimo build da main; o pior caso e um miss, e o CI roda como
      # rodava antes.
      - name: Cache do turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # UM comando. A ordem NAO esta mais aqui — ela vive no `turbo.json`, e por
      # isso vale igual na maquina de quem desenvolve:
      #   build dos pacotes -> typecheck e lint (que precisam dos .d.ts emitidos)
      #   e a suite rapida em paralelo -> build dos apps.
      #
      # O `next build` continua sendo a unica coisa que exercita a resolucao do
      # subcaminho `@vislow/visual-kit/nodes` por um bundler.
      #
      # A guarda do CSS do ADR-02 saiu daqui: virou passo do `build` do
      # visual-kit (`packages/visual-kit/scripts/check-css.mjs`), entao agora
      # vale tambem no `pnpm dev` local, e nao so no CI.
      - name: Verificar (build, typecheck, lint, testes)
        run: pnpm exec turbo run build typecheck lint lint:docs test --cache-dir=.turbo/cache

      # O GATE DE ACEITE do ADR-08: spec -> .pbiviz compilado de verdade ->
      # bundle minificado executado num jsdom. E o herdeiro do teste que pegou o
      # achado 39 — nenhum teste de fonte enxerga o que o webpack fez com o
      # bundle.
      #
      # `stage:vendor` e dependencia declarada desta tarefa, entao nao ha mais
      # como ele ser ignorado por falta de template: se rodar, roda de verdade;
      # se o template faltar, o arquivo lanca no carregamento. Por isso o antigo
      # `VISLOW_REQUIRE_BUILD=1` deixou de existir.
      - name: Gate de compilacao real (spec -> .pbiviz -> render)
        run: pnpm exec turbo run test:build --cache-dir=.turbo/cache
